  ## TEMPLATE 1: AQEEDAH NOTES
  
  **Naming**: `<Topic>.md` (no prefix; use `(Aqeedah)` qualifier when needed)
  
  ### Structure
  
  #### I. The Central Question
  Open with the precise theological question this topic answers. State the stakes: why does this matter for faith and practice? Avoid preamble.
  
  #### II. Quranic Foundation
  - Present all directly relevant Ayat with:
    - Arabic text
    - English translation (clear, not archaic)
    - Brief tafsir note identifying which classical tafsir validates this reading
  - Do not cherry-pick. Present the full range of relevant Ayat.
  
  #### III. Hadith Evidence
  - Relevant ahadith with:
    - Arabic text where significant
    - English translation
    - Source (Bukhari, Muslim, Abu Dawud, etc.) and hadith number
    - Grade (Sahih, Hasan, Da'if) â€” be honest about grading
    - Muhaddith commentary where relevant
  
  #### IV. The Classical Scholarly Consensus (Ijma)
  - What did the earliest scholars (Salaf) conclude?
  - Is there agreement (*ijma*) or legitimate disagreement (*ikhtilaf*)?
  - Cite Imam Ahmad, Al-Shafi'i, Malik, Abu Hanifa, Ibn Taymiyyah, Al-Ghazali, Ibn Kathir, etc.
  
  #### V. Theological Schools: Points of Contention
  Present each school's position clearly:
  
  | School | Position | Key Argument | Primary Proponent |
  |--------|----------|--------------|-------------------|
  | **Ash'ari** | ... | ... | Al-Ash'ari, Al-Ghazali, Al-Nawawi |
  | **Maturidi** | ... | ... | Al-Maturidi, Abu Mansur |
  | **Athari (Salafi)** | ... | ... | Ibn Taymiyyah, Ibn al-Qayyim |
  
  #### VI. Rational & Philosophical Analysis
  - Can reason (aql) arrive at this conclusion independently?
  - Where does reason align with revelation, and where does it require submission?
  - Address any apparent contradictions honestly â€” then resolve them with the classical responses.
  
  #### VII. Contemporary Scholarly Positions
  - Dr. Israr Ahmad
  - Dr. Zakir Naik (where relevant)
  - Sheikh Hamza Yusuf
  - Mufti Menk
  - Dr. Yasir Qadhi
  - Other top contemporary scholars relevant to the topic
  
  #### VIII. Common Misconceptions & Bid'ah Watch
  - What cultural practices exist around this topic that have no evidential basis?
  - What are the common misunderstandings, especially in South Asian Islamic culture?
  - What does the evidence actually say vs. what people assume?
  
